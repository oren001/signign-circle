<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ניגונים - שרים יחד מהלב</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Firebase SDK -->
    <script type="module" src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"></script>
</head>

<body>
    <header class="app-header">
        <div class="header-right">
            <h1 class="app-title">ניגונים</h1>
            <span class="version-tag">v5.5</span>
        </div>

        <div class="header-center" id="songTitleContainer">
            <h2 id="currentSongTitle" class="viewer-song-title">בחרו שיר להתחיל</h2>
        </div>

        <div class="header-left">
            <button id="leaderBtn" class="leader-btn">
                <span>🎤</span> הפוך למנחה
            </button>
            <div id="viewerCount" class="viewer-count">👥 1</div>
        </div>
    </header>

    <main class="app-main">
        <div id="songViewer" class="song-viewer">
            <div id="viewerContainer" class="viewer-container">
                <div id="songDisplay" class="song-display">
                    <!-- Image will be injected here -->
                    <img id="currentSongImg" src="" alt="" style="display: none;">
                </div>
            </div>
        </div>

        <!-- Floating Controls -->
        <div class="nav-controls">
            <button id="openMenuBtn" class="menu-action-btn">
                <span>📚</span> ספריה
            </button>
        </div>
    </main>

    <!-- Song Selector Panel -->
    <div id="songSelector" class="song-selector-panel hidden">
        <div class="panel-header">
            <div class="search-container">
                <input type="text" id="searchInput" class="song-search-input" placeholder="חפש שיר, אמן או מילים...">
            </div>
            <button id="closePanelBtn" class="close-panel-btn">✕</button>
        </div>
        <div id="songListContainer" class="song-list-container">
            <!-- Songs will be rendered here -->
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastContainer" class="toast-container"></div>

    <script type="module" src="app.js"></script>
</body>

</html>
