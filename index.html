<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניגונים בעברית - מעגל שירה</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>

<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-content">
            <h1 class="app-title">🎵 ניגונים בעברית</h1>
            <div class="header-controls">
                <div class="sync-status" id="syncStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">מתחבר...</span>
                </div>
                <div class="viewer-count" id="viewerCount">
                    <span class="count-icon">👥</span>
                    <span class="count-text">0</span>
                </div>
                <button class="leader-btn" id="leaderBtn">הפוך למנחה</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
        <!-- Song Viewer (Focus Mode) -->
        <section class="song-viewer" id="songViewer">
            <div class="viewer-container">
                <div class="song-display" id="songDisplay">
                    <div class="welcome-screen">
                        <h2>ברוכים הבאים לניגונים בעברית! 🎶</h2>
                        <p>השתמשו ברשימה למטה כדי לבחור שיר</p>
                    </div>
                </div>

                <!-- Navigation Controls (Focus Mode) -->
                <div class="focus-controls">
                    <button class="focus-btn" id="openSelectorBtn">
                        <span class="icon">📜</span> בחירת שיר
                    </button>
                    <button class="focus-btn secondary" id="openVotingBtn">
                        <span class="icon">🗳️</span> הצבעות <span class="badge" id="totalVotesBadge">0</span>
                    </button>
                </div>

                <!-- Leader Navigation (Overlay) -->
                <div class="leader-nav hidden" id="navControls">
                    <button class="nav-round-btn prev" id="prevBtn"><span>→</span></button>
                    <button class="nav-round-btn next" id="nextBtn"><span>←</span></button>
                </div>
            </div>
        </section>

        <!-- Song Selector Panel (Slide up) -->
        <aside class="song-selector-panel hidden" id="songSelectorPanel">
            <div class="panel-header">
                <h3>בחירת שיר</h3>
                <button class="close-panel-btn">×</button>
            </div>

            <div class="leader-controls hidden" id="leaderControls">
                <div class="control-section">
                    <div class="add-song-form">
                        <input type="text" id="songUrlInput" placeholder="חיפוש או קישור..." class="song-input">
                        <button class="add-btn" id="addSongBtn">הוסף</button>
                    </div>
                </div>
            </div>

            <div class="song-list-container">
                <div class="song-grid" id="songList">
                    <div class="loading-songs">טוען שירים...</div>
                </div>
            </div>
        </aside>

        <!-- Voting Panel (Slide up) -->
        <aside class="voting-panel hidden" id="votingPanel">
            <div class="panel-header">
                <h3>הצבעות</h3>
                <button class="close-panel-btn">×</button>
            </div>
            <div class="panel-content">
                <div class="vote-list" id="voteList">
                    <!-- Voting items go here -->
                </div>
            </div>
        </aside>
    </main>

    <!-- PIN Entry Modal -->
    <div class="modal hidden" id="pinModal">
        <div class="modal-content">
            <h2>הזינו קוד מנחה</h2>
            <p>הזינו את הקוד בן 4 הספרות כדי להפוך למנחה</p>
            <div class="pin-input-container">
                <input type="password" id="pinInput" maxlength="4" placeholder="****" class="pin-input"
                    inputmode="numeric" pattern="[0-9]*">
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" id="cancelPinBtn">ביטול</button>
                <button class="btn-primary" id="submitPinBtn">אישור</button>
            </div>
            <div class="pin-error hidden" id="pinError">קוד שגוי. נסו שוב.</div>
        </div>
    </div>



    <!-- Scripts -->
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>

</html>
